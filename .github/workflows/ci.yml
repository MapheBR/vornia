name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vornia
          POSTGRES_PASSWORD: vornia
          POSTGRES_DB: vornia
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type check with mypy
        run: mypy vornia/

      - name: Security scan with bandit
        run: bandit -r vornia/

      - name: Verify dev environment
        run: |
          python -m pip_audit --version
          pip check

      - name: Audit dependencies
        run: pip-audit

      - name: Provision database roles
        env:
          PGPASSWORD: vornia
        run: |
          psql -h localhost -U vornia -d vornia \
            -v app_password=vornia_app \
            -v auth_password=vornia_auth \
            -f ../scripts/provision-db-roles.sql

      - name: Test with pytest
        env:
          DATABASE_URL: postgresql://vornia:vornia@localhost:5432/vornia
          DATABASE_URL_APP: postgresql://vornia_app:vornia_app@localhost:5432/vornia
          DATABASE_URL_BOOTSTRAP: postgresql://vornia_auth:vornia_auth@localhost:5432/vornia
          JWT_SECRET: test-secret-not-for-production
          COOKIE_SECURE: "false"
          REDIS_URL: redis://localhost:6379/0
          RATE_LIMIT_ENABLED: "false"
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8080

      - name: Audit dependencies
        run: npm audit
