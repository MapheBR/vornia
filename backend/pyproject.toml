[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vornia"
version = "0.1.0"
description = "Vornia — Workforce Intelligence (evolução do PontoJa)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Tecnova" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "fastapi[standard]>=0.165.0,<0.166.0",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.32.0,<0.35.0",
    "asyncpg>=0.30.0,<0.31.0",
    "pyjwt>=2.10.0,<3.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "python-multipart>=0.0.17,<0.1.0",
    "redis>=5.2.0,<6.0.0",
    "httpx>=0.27.0,<0.29.0",
    "python-dateutil>=2.9.0,<3.0.0",
    "holidays>=0.63",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.5.0,<2.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.8.0,<0.9.0",
    "mypy>=1.13.0,<2.0.0",
    "bandit[toml]>=1.7.10,<2.0.0",
    "pip-audit>=2.7.3,<3.0.0",
    "testcontainers>=4.8.0,<5.0.0",
    "setuptools>=84.1.0",
]

[project.scripts]
vornia = "vornia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vornia"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=vornia --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["vornia"]

[tool.bandit]
exclude_dirs = ["tests"]
