version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vornia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vornia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vornia}
      POSTGRES_DB: ${POSTGRES_DB:-vornia}
      VORNIA_APP_PASSWORD: ${VORNIA_APP_PASSWORD:-vornia_app}
      VORNIA_AUTH_PASSWORD: ${VORNIA_AUTH_PASSWORD:-vornia_auth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/provision-db-roles.sql:/docker-entrypoint-initdb.d/provision-db-roles.sql:ro
      - ./docker/postgres-init/01-provision-roles.sh:/docker-entrypoint-initdb.d/01-provision-roles.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vornia} -d ${POSTGRES_DB:-vornia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vornia-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: vornia-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_APP: ${DATABASE_URL_APP}
      DATABASE_URL_BOOTSTRAP: ${DATABASE_URL_BOOTSTRAP}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    command: uvicorn vornia.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: vornia-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.vornia.local}
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    container_name: vornia-caddy
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
